<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-Roll Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0c0b09;
      --surface:    #141310;
      --card:       #1a1814;
      --border:     #2a2720;
      --border-h:   #3d3830;
      --amber:      #d4a843;
      --amber-d:    #a07a28;
      --amber-l:    #e8c06a;
      --text:       #c8bfa8;
      --text-dim:   #6e6458;
      --text-faint: #3d3830;
      --red:        #c04a3a;
      --green:      #4a8a5a;
      --blue:       #4a7aaa;
      --mono:  'JetBrains Mono', monospace;
      --serif: 'DM Serif Display', Georgia, serif;
      --body:  'Fraunces', Georgia, serif;
    }

    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Film-strip gutters */
    body::before, body::after {
      content: '';
      position: fixed;
      top: 0; bottom: 0;
      width: 18px;
      background: repeating-linear-gradient(
        to bottom,
        var(--surface) 0px, var(--surface) 6px,
        var(--bg) 6px, var(--bg) 12px
      );
      z-index: 100;
    }
    body::before { left: 0;  border-right: 1px solid var(--border); }
    body::after  { right: 0; border-left:  1px solid var(--border); }

    .app { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

    /* ── Header ── */
    header {
      padding: 32px 0 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .wordmark-title {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--amber);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .wordmark-sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .header-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      text-align: right;
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      margin-right: 6px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Search ── */
    .search-section {
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
    }
    .search-row { display: flex; gap: 10px; align-items: stretch; }
    .search-field { flex: 1; position: relative; }
    .search-field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 13px 16px 13px 42px;
      outline: none;
      transition: border-color .15s;
    }
    .search-field input:focus { border-color: var(--amber); }
    .search-field input::placeholder { color: var(--text-dim); }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim); pointer-events: none;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 12px 20px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid; border-radius: 3px;
      cursor: pointer; transition: all .14s;
      white-space: nowrap; line-height: 1;
    }
    .btn-primary { background: var(--amber); border-color: var(--amber); color: #0c0b09; }
    .btn-primary:hover { background: var(--amber-l); border-color: var(--amber-l); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
    .btn-ghost:hover { border-color: var(--border-h); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 10px; }
    .btn-danger { background: transparent; border-color: rgba(192,74,58,.3); color: var(--red); }
    .btn-danger:hover { background: rgba(192,74,58,.1); }

    /* ── Source toggles ── */
    .source-row {
      display: flex; gap: 8px; margin-top: 12px;
      flex-wrap: wrap; align-items: center;
    }
    .source-label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--text-dim); margin-right: 4px;
    }
    .source-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .1em; text-transform: uppercase;
      border: 1px solid var(--border); border-radius: 2px;
      cursor: pointer; color: var(--text-dim);
      transition: all .12s; user-select: none;
    }
    .source-toggle.on { border-color: var(--amber); color: var(--amber); }
    .source-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ── Main 3-column layout ── */
    .main-grid {
      display: grid;
      grid-template-columns: 200px 1fr 300px;
      gap: 0;
      min-height: calc(100vh - 210px);
    }

    /* ── Projects panel (left) ── */
    .projects-panel {
      border-right: 1px solid var(--border);
      padding: 24px 20px 24px 0;
    }
    .panel-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--text-dim);
    }

    .project-list { display: flex; flex-direction: column; gap: 4px; }

    .project-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 3px;
      cursor: pointer; transition: all .12s;
      font-family: var(--mono); font-size: 11px;
      color: var(--text-dim);
    }
    .project-item:hover { border-color: var(--border-h); color: var(--text); }
    .project-item.active { border-color: var(--amber); color: var(--amber); background: rgba(212,168,67,.04); }
    .project-all {
      padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 3px;
      cursor: pointer; transition: all .12s;
      font-family: var(--mono); font-size: 11px;
      color: var(--text-dim); text-align: left;
      background: transparent; width: 100%; display: flex;
      align-items: center; gap: 8px;
    }
    .project-all:hover { border-color: var(--border-h); color: var(--text); }
    .project-all.active { border-color: var(--amber); color: var(--amber); background: rgba(212,168,67,.04); }

    .project-del {
      background: none; border: none; color: var(--text-faint);
      cursor: pointer; font-size: 14px; line-height: 1;
      transition: color .12s; padding: 0 2px;
    }
    .project-del:hover { color: var(--red); }

    .new-project-form { margin-top: 10px; }
    .new-project-form input {
      width: 100%;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text);
      font-family: var(--mono); font-size: 11px;
      padding: 7px 10px; outline: none;
      transition: border-color .15s; margin-bottom: 6px;
    }
    .new-project-form input:focus { border-color: var(--amber); }
    .new-project-form input::placeholder { color: var(--text-dim); }

    /* ── Results panel (centre) ── */
    .results-panel {
      padding: 24px 28px;
      border-right: 1px solid var(--border);
    }

    /* Shimmer */
    .shimmer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .shimmer-card { background: var(--surface); border-radius: 3px; overflow: hidden; animation: shimmer 1.4s ease-in-out infinite; }
    .shimmer-thumb { height: 120px; background: var(--card); }
    .shimmer-line { height: 9px; background: var(--card); margin: 11px 11px 7px; border-radius: 2px; }
    .shimmer-short { width: 55%; height: 8px; background: var(--card); margin: 0 11px 11px; border-radius: 2px; }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.45} }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .video-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 3px; overflow: hidden; cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .video-card:hover { border-color: var(--border-h); transform: translateY(-1px); }
    .video-card.selected { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(212,168,67,.18); }

    .card-thumb {
      position: relative; height: 120px;
      background: var(--surface); overflow: hidden;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .3s;
    }
    .video-card:hover .card-thumb img { transform: scale(1.04); }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 24px;
    }

    .source-badge {
      position: absolute; top: 7px; left: 7px;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 2px;
    }
    .badge-pexels  { background:rgba(0,0,0,.72); color:#4dd4ac; border:1px solid rgba(77,212,172,.3); }
    .badge-pixabay { background:rgba(0,0,0,.72); color:#60a5fa; border:1px solid rgba(96,165,250,.3); }
    .badge-youtube { background:rgba(0,0,0,.72); color:#f87171; border:1px solid rgba(248,113,113,.3); }
    .badge-archive { background:rgba(0,0,0,.72); color:#c084fc; border:1px solid rgba(192,132,252,.3); }

    .duration-badge {
      position: absolute; bottom: 7px; right: 7px;
      font-family: var(--mono); font-size: 10px;
      background: rgba(0,0,0,.75); color: #fff;
      padding: 1px 5px; border-radius: 2px;
    }
    .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.35); opacity: 0; transition: opacity .2s;
    }
    .video-card:hover .play-overlay { opacity: 1; }
    .play-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(212,168,67,.92);
      display: flex; align-items: center; justify-content: center;
      color: #000;
    }

    .card-body { padding: 9px 11px 11px; }
    .card-title {
      font-family: var(--body); font-size: 12px; font-weight: 300;
      color: var(--text); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 8px;
    }
    .card-actions { display: flex; gap: 5px; }
    .card-btn {
      flex: 1; padding: 5px 0;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: .1em; text-transform: uppercase;
      border: 1px solid var(--border); border-radius: 2px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; transition: all .12s; text-align: center;
    }
    .card-btn:hover  { border-color: var(--amber); color: var(--amber); }
    .card-btn.dl-active { color: var(--amber); border-color: var(--amber); animation: pulse 1s infinite; }
    .card-btn.dl-done { color: var(--green); border-color: var(--green); }
    .card-btn.dl-err  { color: var(--red); border-color: var(--red); }

    /* ── Library panel (right) ── */
    .library-panel { padding: 24px 0 24px 24px; }
    .lib-filter {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 12px;
    }
    .lib-filter-badge {
      font-family: var(--mono); font-size: 9px;
      padding: 2px 8px; border-radius: 2px;
      background: rgba(212,168,67,.08); border: 1px solid rgba(212,168,67,.2);
      color: var(--amber);
    }
    .library-scroll {
      display: flex; flex-direction: column; gap: 7px;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .lib-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 3px; padding: 9px 10px;
      display: flex; gap: 9px; align-items: flex-start;
      transition: border-color .12s;
    }
    .lib-item:hover { border-color: var(--border-h); }
    .lib-thumb {
      width: 50px; height: 34px; object-fit: cover;
      border-radius: 2px; flex-shrink: 0; background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-faint);
    }
    .lib-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
    .lib-info { flex: 1; min-width: 0; }
    .lib-title {
      font-size: 11px; font-family: var(--body); font-weight: 300;
      color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .lib-meta {
      font-family: var(--mono); font-size: 9px;
      color: var(--text-dim); margin-top: 2px;
    }
    .lib-project {
      font-family: var(--mono); font-size: 9px;
      color: var(--blue); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lib-status {
      font-family: var(--mono); font-size: 9px;
      padding: 1px 5px; border-radius: 2px; white-space: nowrap;
    }
    .lib-status.complete    { color: var(--green); background: rgba(74,138,90,.1); }
    .lib-status.pending,
    .lib-status.downloading { color: var(--amber); background: rgba(212,168,67,.07); animation: pulse 1s infinite; }
    .lib-status.error       { color: var(--red);   background: rgba(192,74,58,.1); }

    .lib-del {
      background: none; border: none; color: var(--text-faint);
      cursor: pointer; font-size: 14px; line-height: 1;
      transition: color .12s; flex-shrink: 0;
    }
    .lib-del:hover { color: var(--red); }

    .empty-state {
      padding: 36px 16px; text-align: center;
      color: var(--text-dim);
      font-family: var(--mono); font-size: 11px;
      letter-spacing: .1em;
    }
    .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: .3; }

    /* ── Download modal (project selector) ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 40px; backdrop-filter: blur(4px);
    }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border-h);
      border-radius: 4px; width: 100%; max-width: 540px;
      overflow: hidden; animation: modal-in .2s ease;
    }
    @keyframes modal-in {
      from { opacity:0; transform:scale(.97) translateY(8px); }
      to   { opacity:1; transform:scale(1)  translateY(0); }
    }
    .modal-header {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .modal-header-left { flex: 1; }
    .modal-title { font-family: var(--serif); font-size: 17px; color: var(--text); font-style: italic; }
    .modal-subtitle { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 4px; }
    .modal-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 18px; cursor: pointer; transition: color .12s;
      flex-shrink: 0; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 20px; }
    .field-label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .15em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 8px; display: block;
    }
    .field-select {
      width: 100%;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text);
      font-family: var(--mono); font-size: 12px;
      padding: 10px 12px; outline: none;
      transition: border-color .15s; appearance: none;
      cursor: pointer;
    }
    .field-select:focus { border-color: var(--amber); }
    .field-select option { background: var(--card); }

    .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }

    /* ── Preview modal ── */
    .preview-modal .modal-box { max-width: 860px; }
    .modal-video {
      width: 100%; aspect-ratio: 16/9;
      background: #000;
    }
    .modal-video video, .modal-video iframe {
      width: 100%; height: 100%; display: block; border: none;
    }
    .preview-footer {
      padding: 14px 20px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
    }
    .preview-meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
    .preview-license { font-family: var(--mono); font-size: 10px; color: var(--text-faint); font-style: italic; }

    /* ── Toasts ── */
    .toast-stack {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 7px; z-index: 999;
    }
    .toast {
      font-family: var(--mono); font-size: 11px;
      padding: 9px 15px; border-radius: 3px; border: 1px solid;
      animation: toast-in .2s ease; max-width: 280px;
    }
    .toast-success { background:rgba(74,138,90,.15); border-color:var(--green); color:var(--green); }
    .toast-error   { background:rgba(192,74,58,.12); border-color:var(--red);   color:var(--red); }
    .toast-info    { background:rgba(212,168,67,.1); border-color:var(--amber); color:var(--amber); }
    @keyframes toast-in { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:translateX(0)} }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* ── Responsive ── */
    @media (max-width: 1000px) {
      .main-grid { grid-template-columns: 1fr 280px; }
      .projects-panel { display: none; }
    }
    @media (max-width: 680px) {
      .app { padding: 0 24px; }
      .main-grid { grid-template-columns: 1fr; }
      .library-panel { border-top: 1px solid var(--border); padding: 20px 0 0; }
      .results-panel { border-right: none; padding: 20px 0; }
      .library-scroll { max-height: 280px; }
    }
  </style>
</head>
<body>

<div class="app" x-data="brollApp()" x-init="init()">

  <!-- Header -->
  <header>
    <div>
      <div class="wordmark-title">B-Roll Harness</div>
      <div class="wordmark-sub">Visual Research Workbench · Rust/Axum</div>
    </div>
    <div class="header-meta">
      <div><span class="status-dot"></span>System Ready</div>
      <div style="margin-top:3px;" x-text="library.length + ' clips · ' + projects.length + ' projects'"></div>
    </div>
  </header>

  <!-- Search -->
  <section class="search-section">
    <div class="search-row">
      <div class="search-field">
        <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          x-model="query"
          placeholder="volcano eruption, city timelapse, ocean waves..."
          @keydown.enter="doSearch()"
          @keydown.escape="clearSearch()"
        />
      </div>
      <button class="btn btn-primary" @click="doSearch()" :disabled="loading || !query.trim()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Search
      </button>
      <button class="btn btn-ghost" @click="clearSearch()">Clear</button>
    </div>
    <div class="source-row">
      <span class="source-label">Sources:</span>
      <template x-for="src in sources" :key="src.id">
        <div class="source-toggle" :class="src.on ? 'on' : ''" @click="src.on = !src.on">
          <span class="source-dot"></span>
          <span x-text="src.label"></span>
        </div>
      </template>
    </div>
  </section>

  <!-- Main 3-column grid -->
  <div class="main-grid">

    <!-- ── Projects (left) ── -->
    <div class="projects-panel">
      <div class="panel-header">
        <span class="panel-title">Projects</span>
        <button class="btn btn-ghost btn-sm" @click="showNewProject = !showNewProject">+</button>
      </div>

      <div class="new-project-form" x-show="showNewProject" x-cloak>
        <input
          type="text"
          x-model="newProjectName"
          placeholder="Project name..."
          @keydown.enter="createProject()"
          @keydown.escape="showNewProject = false"
          x-ref="newProjectInput"
        />
        <div style="display:flex;gap:5px;">
          <button class="btn btn-primary btn-sm" style="flex:1" @click="createProject()">Create</button>
          <button class="btn btn-ghost btn-sm" @click="showNewProject = false">Cancel</button>
        </div>
      </div>

      <div class="project-list" style="margin-top:8px;">
        <button
          class="project-all"
          :class="activeProjectFilter === null ? 'active' : ''"
          @click="activeProjectFilter = null"
        >
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          All Clips
        </button>

        <template x-for="proj in projects" :key="proj.id">
          <div
            class="project-item"
            :class="activeProjectFilter === proj.id ? 'active' : ''"
            @click="activeProjectFilter = proj.id"
          >
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="proj.name"></span>
            <button class="project-del" @click.stop="deleteProject(proj.id)" title="Delete project">×</button>
          </div>
        </template>

        <div class="empty-state" x-show="projects.length === 0" style="padding:20px 8px;font-size:10px;">
          No projects yet
        </div>
      </div>
    </div>

    <!-- ── Results (centre) ── -->
    <div class="results-panel">
      <div class="panel-header">
        <span class="panel-title">Search Results</span>
        <span class="count-badge" x-show="results.length > 0"
          style="font-family:var(--mono);font-size:10px;color:var(--amber);background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);padding:2px 8px;border-radius:2px;"
          x-text="results.length + ' clips'">
        </span>
      </div>

      <!-- Shimmer -->
      <div class="shimmer-grid" x-show="loading">
        <template x-for="i in 10"><div class="shimmer-card">
          <div class="shimmer-thumb"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-short"></div>
        </div></template>
      </div>

      <!-- Results -->
      <div class="video-grid" x-show="!loading && results.length > 0">
        <template x-for="video in results" :key="video.id">
          <div
            class="video-card"
            :class="selected?.id === video.id ? 'selected' : ''"
            @click="selected = video"
          >
            <div class="card-thumb">
              <template x-if="video.thumbnail">
                <img :src="video.thumbnail" :alt="video.title" loading="lazy" />
              </template>
              <template x-if="!video.thumbnail">
                <div class="thumb-placeholder">▶</div>
              </template>
              <span class="source-badge" :class="'badge-' + video.source" x-text="video.source"></span>
              <template x-if="video.duration">
                <span class="duration-badge" x-text="fmtDur(video.duration)"></span>
              </template>
              <div class="play-overlay">
                <div class="play-btn" @click.stop="openPreview(video)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="card-title" x-text="video.title"></div>
              <div class="card-actions">
                <button class="card-btn" @click.stop="openPreview(video)">Preview</button>
                <button
                  class="card-btn"
                  :class="dlClass(video.id)"
                  @click.stop="openDownloadModal(video)"
                  x-text="dlLabel(video.id)"
                ></button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Empty states -->
      <div class="empty-state" x-show="!loading && results.length === 0 && searched">
        <div class="empty-icon">◻</div>
        No results. Try different keywords or enable more sources.
      </div>
      <div class="empty-state" x-show="!loading && !searched">
        <div class="empty-icon">⌕</div>
        Enter a search query to begin.
      </div>
    </div>

    <!-- ── Library (right) ── -->
    <div class="library-panel">
      <div class="panel-header">
        <span class="panel-title">
          Library
          <template x-if="activeProjectFilter">
            <span class="lib-filter-badge" x-text="projectName(activeProjectFilter)"></span>
          </template>
        </span>
        <button class="btn btn-ghost btn-sm" @click="loadLibrary()">↺</button>
      </div>

      <div class="library-scroll">
        <div class="empty-state" x-show="filteredLibrary.length === 0" style="padding:28px 8px;">
          <div class="empty-icon">📁</div>
          <div x-text="activeProjectFilter ? 'No clips in this project' : 'No downloads yet'"></div>
        </div>

        <template x-for="item in filteredLibrary" :key="item.id">
          <div class="lib-item">
            <div class="lib-thumb">
              <template x-if="item.thumbnail">
                <img :src="item.thumbnail" :alt="item.title" loading="lazy" />
              </template>
              <template x-if="!item.thumbnail">▶</template>
            </div>
            <div class="lib-info">
              <div class="lib-title" x-text="item.title"></div>
              <div class="lib-meta" x-text="item.source + (item.duration ? ' · ' + fmtDur(item.duration) : '')"></div>
              <template x-if="item.project_name">
                <div class="lib-project" x-text="'📁 ' + item.project_name"></div>
              </template>
              <span class="lib-status" :class="item.status" x-text="item.status"></span>
            </div>
            <button class="lib-del" @click="deleteClip(item.id)" title="Remove">×</button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ── Download / Project selector modal ── -->
  <div class="modal-overlay" x-show="downloadModal" @click.self="downloadModal = null" x-cloak>
    <div class="modal-box" @click.stop>
      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-title" x-text="downloadModal?.title"></div>
          <div class="modal-subtitle" x-text="downloadModal?.source + (downloadModal?.duration ? ' · ' + fmtDur(downloadModal.duration) : '')"></div>
        </div>
        <button class="modal-close" @click="downloadModal = null">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Save to project</label>
        <select class="field-select" x-model="pendingProjectId">
          <option value="">— No project (downloads/) —</option>
          <template x-for="proj in projects" :key="proj.id">
            <option :value="proj.id" x-text="proj.name"></option>
          </template>
        </select>
        <div style="margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--text-dim);">
          Files are saved to
          <span style="color:var(--amber);"
            x-text="pendingProjectId ? 'downloads/' + projectSlug(pendingProjectId) + '/' : 'downloads/'">
          </span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" @click="downloadModal = null">Cancel</button>
        <button class="btn btn-primary" @click="confirmDownload()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- ── Preview modal ── -->
  <div class="modal-overlay preview-modal" x-show="preview" @click.self="preview = null" x-cloak>
    <div class="modal-box" @click.stop>
      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-title" x-text="preview?.title"></div>
        </div>
        <button class="modal-close" @click="preview = null">✕</button>
      </div>
      <div class="modal-video">
        <template x-if="preview?.source === 'youtube'">
          <iframe :src="preview.preview_url + '?autoplay=1&rel=0'" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </template>
        <template x-if="preview?.source === 'archive'">
          <iframe :src="preview.preview_url" allow="fullscreen" allowfullscreen></iframe>
        </template>
        <template x-if="preview?.source !== 'youtube' && preview?.source !== 'archive'">
          <video :src="preview?.preview_url" controls autoplay style="background:#000;"></video>
        </template>
      </div>
      <div class="preview-footer">
        <div>
          <div class="preview-meta" x-text="preview?.source + (preview?.duration ? ' · ' + fmtDur(preview.duration) : '') + (preview?.width ? ' · ' + preview.width + '×' + preview.height : '')"></div>
          <div class="preview-license" x-text="preview?.license"></div>
        </div>
        <button class="btn btn-primary" @click="openDownloadModal(preview); preview = null">
          ↓ Save to Library
        </button>
      </div>
    </div>
  </div>

  <!-- ── Toasts ── -->
  <div class="toast-stack">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" :class="'toast-' + t.type" x-text="t.msg"></div>
    </template>
  </div>

</div>

<script>
function brollApp() {
  return {
    // Search
    query: '',
    results: [],
    loading: false,
    searched: false,
    selected: null,
    sources: [
      { id: 'pexels',  label: 'Pexels',  on: true },
      { id: 'pixabay', label: 'Pixabay', on: true },
      { id: 'archive', label: 'Archive', on: true },
      { id: 'youtube', label: 'YouTube', on: true },
    ],

    // Library
    library: [],
    activeProjectFilter: null,

    // Projects
    projects: [],
    showNewProject: false,
    newProjectName: '',

    // Download modal
    downloadModal: null,  // video pending project selection
    pendingProjectId: '',

    // Preview modal
    preview: null,

    // Download tracking
    dlStates: {},  // id -> 'active' | 'done' | 'error'
    pollTimers: {},

    // Toasts
    toasts: [],

    // ── Lifecycle ──────────────────────────────────────────────────────
    init() {
      this.loadProjects();
      this.loadLibrary();
      // Auto-refresh while downloads are running
      setInterval(() => {
        const hasActive = Object.values(this.dlStates).some(s => s === 'active');
        if (hasActive) this.loadLibrary();
      }, 5000);
    },

    get filteredLibrary() {
      if (!this.activeProjectFilter) return this.library;
      return this.library.filter(v => v.project_id === this.activeProjectFilter);
    },

    // ── Search ────────────────────────────────────────────────────────
    async doSearch() {
      const q = this.query.trim();
      if (!q) return;
      this.loading = true;
      this.searched = true;
      this.results = [];
      try {
        const sources = this.sources.filter(s => s.on).map(s => s.id).join(',');
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&sources=${sources}`);
        if (!res.ok) throw new Error(await res.text());
        this.results = await res.json();
      } catch (e) {
        this.toast('Search failed: ' + e.message, 'error');
      } finally {
        this.loading = false;
      }
    },

    clearSearch() {
      this.query = ''; this.results = [];
      this.searched = false; this.selected = null;
    },

    // ── Preview ───────────────────────────────────────────────────────
    openPreview(video) { this.preview = video; },

    // ── Download modal ────────────────────────────────────────────────
    openDownloadModal(video) {
      if (!video) return;
      if (this.dlStates[video.id] === 'active') return;
      this.downloadModal = video;
      // Pre-select the active project filter if set
      this.pendingProjectId = this.activeProjectFilter || '';
    },

    async confirmDownload() {
      const video = this.downloadModal;
      if (!video) return;
      this.downloadModal = null;
      this.dlStates[video.id] = 'active';
      this.toast('Download started: ' + video.title.slice(0, 40) + '…', 'info');

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: video.id,
            title: video.title,
            source: video.source,
            download_url: video.download_url,
            thumbnail: video.thumbnail,
            duration: video.duration,
            project_id: this.pendingProjectId || null,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        this.pendingProjectId = '';
        this.loadLibrary();
        this.pollStatus(video.id);
      } catch (e) {
        this.dlStates[video.id] = 'error';
        this.toast('Download failed: ' + e.message, 'error');
      }
    },

    pollStatus(id) {
      clearInterval(this.pollTimers[id]);
      this.pollTimers[id] = setInterval(async () => {
        try {
          const res = await fetch(`/api/download/status/${encodeURIComponent(id)}`);
          const data = await res.json();
          if (data.status === 'complete') {
            this.dlStates[id] = 'done';
            clearInterval(this.pollTimers[id]);
            this.toast('Download complete!', 'success');
            this.loadLibrary();
          } else if (data.status === 'error') {
            this.dlStates[id] = 'error';
            clearInterval(this.pollTimers[id]);
            this.toast('Download error.', 'error');
            this.loadLibrary();
          }
        } catch (_) {}
      }, 3000);
    },

    dlClass(id) {
      const s = this.dlStates[id];
      if (s === 'active') return 'dl-active';
      if (s === 'done')   return 'dl-done';
      if (s === 'error')  return 'dl-err';
      return '';
    },
    dlLabel(id) {
      const s = this.dlStates[id];
      if (s === 'active') return '⟳ Fetching';
      if (s === 'done')   return '✓ Saved';
      if (s === 'error')  return '✗ Error';
      return '↓ Save';
    },

    // ── Library ───────────────────────────────────────────────────────
    async loadLibrary() {
      try {
        const res = await fetch('/api/library');
        const data = await res.json();
        this.library = data;
        // Sync states from DB
        data.forEach(item => {
          if (item.status === 'complete')   this.dlStates[item.id] = 'done';
          if (item.status === 'error')      this.dlStates[item.id] = 'error';
          if (item.status === 'downloading' || item.status === 'pending')
            this.dlStates[item.id] = 'active';
        });
      } catch (_) {}
    },

    async deleteClip(id) {
      try {
        await fetch(`/api/library/${encodeURIComponent(id)}`, { method: 'DELETE' });
        delete this.dlStates[id];
        this.loadLibrary();
        this.toast('Clip removed', 'info');
      } catch (_) { this.toast('Delete failed', 'error'); }
    },

    // ── Projects ──────────────────────────────────────────────────────
    async loadProjects() {
      try {
        const res = await fetch('/api/projects');
        this.projects = await res.json();
      } catch (_) {}
    },

    async createProject() {
      const name = this.newProjectName.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed');
        }
        this.newProjectName = '';
        this.showNewProject = false;
        await this.loadProjects();
        this.toast('Project created: ' + name, 'success');
      } catch (e) {
        this.toast(e.message, 'error');
      }
    },

    async deleteProject(id) {
      try {
        await fetch(`/api/projects/${id}`, { method: 'DELETE' });
        if (this.activeProjectFilter === id) this.activeProjectFilter = null;
        await this.loadProjects();
        await this.loadLibrary();
        this.toast('Project deleted', 'info');
      } catch (_) { this.toast('Delete failed', 'error'); }
    },

    projectName(id) {
      return this.projects.find(p => p.id === id)?.name || '';
    },
    projectSlug(id) {
      return this.projects.find(p => p.id === id)?.slug || '';
    },

    // ── Utils ─────────────────────────────────────────────────────────
    fmtDur(seconds) {
      if (!seconds) return '';
      const s = Math.round(seconds);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return `${h}:${String(m % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
      return `${m}:${String(s % 60).padStart(2,'0')}`;
    },

    toast(msg, type = 'info') {
      const id = Date.now();
      this.toasts.push({ id, msg, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 4000);
    },
  };
}
</script>
</body>
</html>
