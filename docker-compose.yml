version: "3.9"

services:
  broll:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./library.db:/app/library.db
    environment:
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      - DATABASE_URL=sqlite:///app/library.db
      - DOWNLOADS_DIR=/app/downloads
    restart: unless-stopped
